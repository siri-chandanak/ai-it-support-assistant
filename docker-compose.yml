services:
  postgres:
    image: postgres:17-alpine
    container_name: ai-support-postgres
    environment:
      POSTGRES_DB: ai_support
      POSTGRES_USER: ai_support
      POSTGRES_PASSWORD: ai_support_local_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ai_support -d ai_support",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai-support-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "echo > /dev/tcp/127.0.0.1/6333",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
  
  opa:
    image: openpolicyagent/opa:1.8.0
    container_name: ai-support-opa
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - /policy/policies
    ports:
      - "8181:8181"
    volumes:
      - ./opa:/policy:ro
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data: