apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-pvc
  namespace: ai-support
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: ai-support
  labels:
    app: qdrant
spec:
  replicas: 1

  selector:
    matchLabels:
      app: qdrant

  strategy:
    type: Recreate

  template:
    metadata:
      labels:
        app: qdrant

    spec:
      containers:
        - name: qdrant

          image: qdrant/qdrant:v1.19.1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 6333

            - name: grpc
              containerPort: 6334

          volumeMounts:
            - name: qdrant-data
              mountPath: /qdrant/storage

          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60

          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"

      volumes:
        - name: qdrant-data
          persistentVolumeClaim:
            claimName: qdrant-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: ai-support
spec:
  selector:
    app: qdrant

  ports:
    - name: http
      port: 6333
      targetPort: http

    - name: grpc
      port: 6334
      targetPort: grpc

  type: ClusterIP