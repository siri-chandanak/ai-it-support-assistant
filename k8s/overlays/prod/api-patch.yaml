apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-support-api
  namespace: ai-support

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    spec:
      containers:
        - name: api
          imagePullPolicy: IfNotPresent