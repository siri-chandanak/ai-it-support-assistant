name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Test and lint
    runs-on: ubuntu-latest

    env:
      TEST_DATABASE_URL: postgresql+psycopg://ai_support:ai_support_test_password@localhost:5432/ai_support_test
      DATABASE_URL: postgresql+psycopg://ai_support:ai_support_test_password@localhost:5432/ai_support_test
      POLICY_PDP_MODE: local
      
    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_USER: ai_support
          POSTGRES_PASSWORD: ai_support_test_password
          POSTGRES_DB: ai_support_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U ai_support -d ai_support_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Install OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: v1.20.2

      - name: Verify OPA installation
        run: opa version

      - name: Run lint checks
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest

      - name: Check migration drift
        run: uv run alembic check

      - name: Check Rego formatting
        run: opa fmt --fail opa/bundle opa/tests

      - name: Run Rego tests
        run: opa test opa/bundle opa/tests -v --fail-on-empty

      - name: Seed policy evaluation data
        run: uv run python scripts/seed_policy_evaluation_data.py

      - name: Run policy evaluation
        run: uv run python scripts/run_policy_evaluation.py

      - name: Run RAG evaluation
        run: uv run python scripts/run_rag_evaluation.py

      - name: Run security evaluation
        run: uv run python scripts/run_security_evaluation.py

      - name: Run agent routing evaluation
        run: uv run python scripts/evaluate_agent_routing.py

      - name: Prepare OPA bundle metadata
        env:
          POLICY_REVISION: ${{ github.sha }}
          POLICY_VERSION: ${{ github.ref_name }}
        run: uv run python scripts/build_opa_bundle.py

      - name: Build OPA bundle
        run: |
          mkdir -p dist
          cd opa/bundle
          opa build \
            --bundle . \
            --output ../../dist/ai-it-support-authz.tar.gz

      - name: Inspect OPA bundle
        run: opa inspect dist/ai-it-support-authz.tar.gz

      - name: Generate OPA bundle checksum
        run: sha256sum dist/ai-it-support-authz.tar.gz