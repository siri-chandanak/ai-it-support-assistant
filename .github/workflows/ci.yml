name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Test and lint
    runs-on: ubuntu-latest

    env:
      TEST_DATABASE_URL: postgresql+psycopg://ai_support:ai_support_test_password@localhost:5432/ai_support_test
      DATABASE_URL: postgresql+psycopg://ai_support:ai_support_test_password@localhost:5432/ai_support_test
      POLICY_PDP_MODE: local
      QDRANT_URL: http://localhost:6333
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      
    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_USER: ai_support
          POSTGRES_PASSWORD: ai_support_test_password
          POSTGRES_DB: ai_support_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U ai_support -d ai_support_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
          - 6334:6334
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Install OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: v1.20.2

      - name: Verify OPA installation
        run: opa version

      - name: Run lint checks
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Initialize Qdrant collection
        run: |
          uv run python - <<'PY'
          from qdrant_client import QdrantClient

          from ai_it_support_assistant.core.config import get_settings
          from ai_it_support_assistant.services.vector_store_service import (
              ensure_collection,
          )

          settings = get_settings()

          client = QdrantClient(
              url=settings.qdrant_url,
              timeout=settings.qdrant_timeout_seconds,
          )

          ensure_collection(
              client=client,
              collection_name=settings.qdrant_collection_name,
              vector_size=384,
          )

          print(
              f"Qdrant collection ready: "
              f"{settings.qdrant_collection_name}"
          )
          PY

      - name: Run tests
        run: uv run pytest

      - name: Check migration drift
        run: uv run alembic check

      - name: Check Rego formatting
        run: opa fmt --fail opa/bundle opa/tests

      - name: Run Rego tests
        run: opa test opa/bundle opa/tests -v --fail-on-empty

      - name: Seed policy evaluation data
        run: uv run python scripts/seed_policy_evaluation_data.py

      - name: Run policy evaluation
        run: uv run python scripts/run_policy_evaluation.py

      - name: Prepare OPA bundle metadata
        env:
          POLICY_REVISION: ${{ github.sha }}
          POLICY_VERSION: ${{ github.ref_name }}
        run: uv run python scripts/build_opa_bundle.py

      - name: Build OPA bundle
        run: |
          mkdir -p dist
          cd opa/bundle
          opa build \
            --bundle . \
            --output ../../dist/ai-it-support-authz.tar.gz

      - name: Inspect OPA bundle
        run: opa inspect dist/ai-it-support-authz.tar.gz

      - name: Generate OPA bundle checksum
        run: sha256sum dist/ai-it-support-authz.tar.gz

      - name: Upload OPA bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-it-support-authz-${{ github.sha }}
          path: dist/ai-it-support-authz.tar.gz
          if-no-files-found: error

  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest

    needs:
      - quality

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: siri019/ai-it-support-assistant
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
